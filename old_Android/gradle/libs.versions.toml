[versions]
# Android SDK
biometric = "1.1.0"
compileSdk = "36"
minSdk = "21"
securityCrypto = "1.1.0"
targetSdk = "34"

# Plugins
androidGradlePlugin = "8.13.2"
kotlin = "2.1.20"
navigationSafeArgsGradlePlugin = "2.9.6"
googleServicesGradlePlugin = "4.4.4"
ksp = "2.1.20-1.0.32"

# Libraries
acra = "5.13.1"
sdpAndroid = "1.1.1"
sspAndroid = "1.1.1"
fastAndroidNetworking = "1.0.4"
prdownloader = "1.0.2"  # Added PRDownloader version
androidxCore = "1.17.0"
androidxAppcompat = "1.7.1"
androidxConstraintlayout = "2.2.1"
androidxExifinterface = "1.4.2"
androidxLegacySupportV4 = "1.0.0"
androidxLifecycleViewmodelKtx = "2.9.4"
androidxLifecycle = "2.9.4"
androidxLifecycleExtensions = "2.2.0"
androidxRecyclerview = "1.4.0"
androidxRoom = "2.7.2"
androidxNavigation = "2.9.6"
androidxActivityKtx = "1.11.0"
androidxPagingRuntime = "3.3.6"
androidxBrowser = "1.9.0"
androidxFragmentKtx = "1.8.9"
androidxSwiperefreshlayout = "1.2.0"
androidxDocumentFile = "1.1.0"

firebaseBom = "34.7.0"

googleMaterial = "1.13.0"
junit = "4.13.2"
androidxTestExtJunit = "1.3.0"
androidxTestEspresso = "3.7.0"

coil = "2.7.0"
materialStepperView = "0.2.5"
retrofit = "3.0.0"
kotlinxSerializationConverter = "1.0.0"
kotlinxSerializationJson = "1.9.0"
okhttp = "5.3.2"
coroutines = "1.10.2"
hilt = "2.57.2"
timber = "5.0.1"
lottie = "6.7.1"
persianDate = "1.1"
mpAndroidChart = "3.1.0"
materialTapTargetPrompt = "3.3.2"
pdfViewer = "2.3.7"
chucker = "4.2.0"
zoomLayout = "1.9.0"
speedDial = "3.3.0"
zxingCore = "3.5.4"
sentry = "5.12.2"
[libraries]
# ACRA
acra-toast = { group = "ch.acra", name = "acra-toast", version.ref = "acra" }
acra-http = { group = "ch.acra", name = "acra-http", version.ref = "acra" }

# SDP SSP
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }
intuit-sdp = { group = "com.intuit.sdp", name = "sdp-android", version.ref = "sdpAndroid" }
intuit-ssp = { group = "com.intuit.ssp", name = "ssp-android", version.ref = "sspAndroid" }

# Fast Android Networking
fastandroidnetworking = { group = "com.github.amitshekhariitbhu.Fast-Android-Networking", name = "android-networking", version.ref = "fastAndroidNetworking" }

# PRDownloader
prdownloader = { group = "com.github.amitshekhariitbhu", name = "PRDownloader", version.ref = "prdownloader" }

# AndroidX
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidxAppcompat" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "androidxConstraintlayout" }
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "androidxExifinterface" }
androidx-legacy-support-v4 = { group = "androidx.legacy", name = "legacy-support-v4", version.ref = "androidxLegacySupportV4" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "androidxLifecycleViewmodelKtx" }
androidx-lifecycle-livedata-ktx = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-common-java8 = { group = "androidx.lifecycle", name = "lifecycle-common-java8", version.ref = "androidxLifecycle" }
androidx-lifecycle-extensions = { group = "androidx.lifecycle", name = "lifecycle-extensions", version.ref = "androidxLifecycleExtensions" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "androidxRecyclerview" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "androidxRoom" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "androidxRoom" }
androidx-room-paging = { group = "androidx.room", name = "room-paging", version.ref = "androidxRoom" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "androidxRoom" }
androidx-navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "androidxNavigation" }
androidx-navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "androidxNavigation" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "androidxActivityKtx" }
androidx-paging-runtime = { group = "androidx.paging", name = "paging-runtime", version.ref = "androidxPagingRuntime" }
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "androidxBrowser" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "androidxFragmentKtx" }
androidx-swiperefreshlayout = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "androidxSwiperefreshlayout" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "androidxDocumentFile" }


# Firebase
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }

# Google Material
google-material = { group = "com.google.android.material", name = "material", version.ref = "googleMaterial" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidxTestEspresso" }

# Coil
coil-kt = { group = "io.coil-kt", name = "coil", version.ref = "coil" }
coil-kt-svg = { group = "io.coil-kt", name = "coil-svg", version.ref = "coil" }

# Retrofit, OkHttp, Kotlinx Serialization
retrofit-core = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
retrofit-converter-scalars = { group = "com.squareup.retrofit2", name = "converter-scalars", version.ref = "retrofit" }
retrofit-kotlinx-serialization-converter = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version.ref = "kotlinxSerializationConverter" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
okhttp-core = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }

# Coroutines
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }

# Kotlin Reflect
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "kotlin" }

# Other UI/Util Libs
materialStepperView = { group = "moe.feng", name = "MaterialStepperView", version.ref = "materialStepperView" }
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }
lottie = { group = "com.airbnb.android", name = "lottie", version.ref = "lottie" }
persianDate = { group = "com.github.samanzamani", name = "PersianDate", version.ref = "persianDate" }
mpAndroidChart = { group = "com.github.PhilJay", name = "MPAndroidChart", version.ref = "mpAndroidChart" }
materialTapTargetPrompt = { group = "uk.co.samuelwall", name = "material-tap-target-prompt", version.ref = "materialTapTargetPrompt" }
pdfViewer = { group = "io.github.afreakyelf", name = "Pdf-Viewer", version.ref = "pdfViewer" }
chucker-library = { group = "com.github.chuckerteam.chucker", name = "library", version.ref = "chucker" }
chucker-library-no-op = { group = "com.github.chuckerteam.chucker", name = "library-no-op", version.ref = "chucker" }
otaliastudios-zoomlayout = { group = "com.otaliastudios", name = "zoomlayout", version.ref = "zoomLayout" }
leinardi-speeddial = { group = "com.leinardi.android", name = "speed-dial", version.ref = "speedDial" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxingCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
androidx-navigation-safeargs = { id = "androidx.navigation.safeargs.kotlin", version.ref = "navigationSafeArgsGradlePlugin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
google-gms-services = { id = "com.google.gms.google-services", version.ref = "googleServicesGradlePlugin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "androidxRoom" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

sentry = { id = "io.sentry.android.gradle", version.ref = "sentry" }

[bundles]
# Example: room-bundle = ["androidx-room-runtime", "androidx-room-ktx"]
# Example: lifecycle-bundle = ["androidx-lifecycle-viewmodel-ktx", "androidx-lifecycle-livedata-ktx", "androidx-lifecycle-common-java8"]
