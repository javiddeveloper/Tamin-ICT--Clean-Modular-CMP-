variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

stages:
  - test
  - build
  - release

# -----------------------------------------------------------------------------
# Android Jobs
# -----------------------------------------------------------------------------
.android-base:
  image: pull-devops.tamin.ir/openjdk:17-jdk
  tags:
    - devops
  before_script:
    - export GRADLE_USER_HOME=$(pwd)/.gradle
    # Decode Keystore from Base64 variable
    - echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.jks
    - export RELEASE_KEYSTORE=$(pwd)/release.jks
    # Create key.properties from environment variables if it doesn't exist
    - |
      if [ ! -f "key.properties" ]; then
        echo "OPERATIONAL_API_KEY=$OPERATIONAL_API_KEY" >> key.properties
        echo "TEST_API_KEY=$TEST_API_KEY" >> key.properties
      fi

android-test:
  extends: .android-base
  stage: test
  script:
    - ./gradlew :androidApp:lintDebug test
  artifacts:
    paths:
      - "**/build/reports/"
    expire_in: 1 week
  only:
    - merge_requests
    - master
    - main

# Build all flavors for debug
android-build-debug:
  extends: .android-base
  stage: build
  script:
    - ./gradlew :androidApp:assembleDirectDebug :androidApp:assembleFlavorTestDebug
  artifacts:
    paths:
      - androidApp/build/outputs/apk/*/debug/*.apk
    expire_in: 1 week
  only:
    - merge_requests
    - master
    - main

# Release specific flavors
android-release-direct:
  extends: .android-base
  stage: release
  script:
    - ./gradlew :androidApp:assembleDirectRelease
  artifacts:
    paths:
      - androidApp/build/outputs/apk/direct/release/*.apk
  only:
    - tags

android-release-reporter:
  extends: .android-base
  stage: release
  script:
    - ./gradlew :androidApp:assembleReporterRelease
  artifacts:
    paths:
      - androidApp/build/outputs/apk/reporter/release/*.apk
  only:
    - tags

# -----------------------------------------------------------------------------
# iOS Jobs
# -----------------------------------------------------------------------------
ios-build:
  stage: build
  tags:
    - macos
  script:
    - xcodebuild build
      -project iosApp/iosApp.xcodeproj
      -scheme iosApp
      -destination 'generic/platform=iOS Simulator'
      CODE_SIGNING_REQUIRED=NO
      CODE_SIGNING_ALLOWED=YES
  only:
    - merge_requests
    - master
    - main
