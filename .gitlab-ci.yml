variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

stages:
  - test
  - build
  - release

# -----------------------------------------------------------------------------
# Android Configuration
# -----------------------------------------------------------------------------
.android-base:
  image: pull-devops.tamin.ir/devops/android-sdk-image:1.0
  tags:
    - devops
  before_script:
    - export GRADLE_USER_HOME=$(pwd)/.gradle
    - chmod +x gradlew
    - echo '#!/bin/sh' > xargs
    - echo 'while [ "$#" -gt 0 ]; do case "$1" in -n*) shift ;; *) break ;; esac; done' >> xargs
    - echo 'sed "s/\"//g" | tr " " "\n" | grep -v "^$"' >> xargs
    - chmod +x xargs
    - export PATH=$(pwd):$PATH
    - |
      if [ ! -f "key.properties" ]; then
        echo "OPERATIONAL_API_KEY=$OPERATIONAL_API_KEY" >> key.properties
        echo "TEST_API_KEY=$TEST_API_KEY" >> key.properties
      fi
    - |
      if [ ! -z "$RELEASE_KEYSTORE_BASE64" ]; then
        echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.jks
        export RELEASE_KEYSTORE=$(pwd)/release.jks
        echo "Keystore decoded successfully."
      fi

# -----------------------------------------------------------------------------
# Test
# -----------------------------------------------------------------------------
android-test:
  extends: .android-base
  stage: test
  script:
    - ./gradlew testDebugUnitTest testDirectDebugUnitTest
  artifacts:
    paths:
      - "**/build/reports/"
    expire_in: 1 week
  only:
    - merge_requests
    - main
    - develop

# -----------------------------------------------------------------------------
# Build (Debug)
# -----------------------------------------------------------------------------
android-build-debug:
  extends: .android-base
  stage: build
  script:
    - ./gradlew :androidApp:assembleDirectDebug :androidApp:assembleFlavorTestDebug
  artifacts:
    paths:
      - androidApp/build/outputs/apk/*/debug/*.apk
    expire_in: 1 week
  only:
    - merge_requests
    - main
    - develop

# -----------------------------------------------------------------------------
# Release (فقط روی tag)
# -----------------------------------------------------------------------------
android-release:
  extends: .android-base
  stage: release
  script:
    - ./gradlew :androidApp:assembleDirectRelease
      :androidApp:assembleCaffeBazaarRelease
      :androidApp:assembleMyketRelease
      :androidApp:assembleReporterRelease
  artifacts:
    name: "TaminX-$CI_COMMIT_TAG"
    paths:
      - androidApp/build/outputs/apk/direct/release/*.apk
      - androidApp/build/outputs/apk/caffeBazaar/release/*.apk
      - androidApp/build/outputs/apk/myket/release/*.apk
      - androidApp/build/outputs/apk/reporter/release/*.apk
  only:
    - tags

# -----------------------------------------------------------------------------
# GitLab Release (نمایش APKها توی صفحه Tags)
# -----------------------------------------------------------------------------
create-release:
  image: pull-devops.tamin.ir/devops/android-sdk-image:1.0
  tags:
    - devops
  stage: release
  needs:
    - android-release
  script:
    - |
      DIRECT_APK=$(ls androidApp/build/outputs/apk/direct/release/*.apk | head -1)
      BAZAAR_APK=$(ls androidApp/build/outputs/apk/caffeBazaar/release/*.apk | head -1)
      MYKET_APK=$(ls androidApp/build/outputs/apk/myket/release/*.apk | head -1)
      REPORTER_APK=$(ls androidApp/build/outputs/apk/reporter/release/*.apk | head -1)

      # آپلود APKها به GitLab Package Registry
      curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file "$DIRECT_APK" \
           "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/android/$CI_COMMIT_TAG/$(basename $DIRECT_APK)"

      curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file "$BAZAAR_APK" \
           "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/android/$CI_COMMIT_TAG/$(basename $BAZAAR_APK)"

      curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file "$MYKET_APK" \
           "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/android/$CI_COMMIT_TAG/$(basename $MYKET_APK)"

      curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file "$REPORTER_APK" \
           "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/android/$CI_COMMIT_TAG/$(basename $REPORTER_APK)"

      # ساختن Release توی GitLab
      curl --request POST \
           --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --header "Content-Type: application/json" \
           --data "{
             \"name\": \"Release $CI_COMMIT_TAG\",
             \"tag_name\": \"$CI_COMMIT_TAG\",
             \"assets\": {
               \"links\": [
                 {\"name\": \"Direct APK\", \"url\": \"$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/android/$CI_COMMIT_TAG/$(basename $DIRECT_APK)\"},
                 {\"name\": \"CaffeBazaar APK\", \"url\": \"$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/android/$CI_COMMIT_TAG/$(basename $BAZAAR_APK)\"},
                 {\"name\": \"Myket APK\", \"url\": \"$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/android/$CI_COMMIT_TAG/$(basename $MYKET_APK)\"},
                 {\"name\": \"Reporter APK\", \"url\": \"$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/android/$CI_COMMIT_TAG/$(basename $REPORTER_APK)\"}
               ]
             }
           }" \
           "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
  only:
    - tags
